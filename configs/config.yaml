# MMS Fault Classification Configuration

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  file_map:
    normal: "normal.csv"
    unbalance_fault: "unbalance_fault.csv"
    misalignment_fault: "misalignment_fault.csv"
    bearing_fault: "bearing_fault.csv"
  window_size: 1024
  num_channels: 3
  sampling_rate: 5120  # Hz

preprocessing:
  test_size: 0.2
  val_size: 0.5  # Of remaining data after test split
  normalize: true
  random_state: 42

augmentation:
  enabled: true
  probability: 0.5
  augmentation_factor: 2
  techniques:
    - gaussian_noise
    - amplitude_scaling
    - time_shift
    - random_masking

training:
  batch_size: 64
  epochs: 60
  optimizer: "adam"
  learning_rate: 0.001
  early_stopping_patience: 10
  reduce_lr_patience: 5
  reduce_lr_factor: 0.5
  min_lr: 1.0e-7

models:
  cnn:
    base_filters: 32
    dropout_rate: 0.3
    l2_reg: 1.0e-4

  resnet1d:
    depth: 18  # Options: 18, 34, 50
    base_filters: 64
    dropout_rate: 0.3
    l2_reg: 1.0e-4

  inception:
    depth: 6
    nb_filters: 32
    kernel_sizes: [10, 20, 40]
    bottleneck_size: 32
    use_residual: true
    dropout_rate: 0.3

  dual_branch:
    base_filters: 32
    dropout_rate: 0.3
    l2_reg: 1.0e-4
    fusion_method: "concatenate"  # Options: concatenate, add, multiply

  cwt:
    scales_min: 1
    scales_max: 129
    wavelet: "morl"
    base_filters: 32
    dropout_rate: 0.3
    l2_reg: 1.0e-4

paths:
  save_dir: "models/saved_models"
  metrics_dir: "models/metrics"
  logs_dir: "logs"

api:
  host: "0.0.0.0"
  port: 8000
  model_path: "models/saved_models/best_model.h5"
  scaler_path: "models/saved_models/scaler.pkl"
  encoder_path: "models/saved_models/encoder.pkl"
